<div class="card acento" style="max-width:520px">
  <h2><i class="fas fa-user-shield"></i> Mi cuenta</h2>
  <p class="desc">{{ nombre }} · {{ rol }}</p>

  <div class="nota">
    Definí tu contraseña para entrar de forma segura. Se cifra en tu navegador antes de enviarse.
  </div>

  <div class="form-group"><label>Nueva contraseña</label>
    <input type="password" [(ngModel)]="clave" autocomplete="new-password" placeholder="••••••••"></div>
  <div class="form-group"><label>Repetir contraseña</label>
    <input type="password" [(ngModel)]="repetir" autocomplete="new-password" placeholder="••••••••"></div>

  <p class="mensaje" [class.error]="error" *ngIf="mensaje">{{ mensaje }}</p>
  <button class="btn success" (click)="guardar()" [disabled]="guardando">
    <i class="fas fa-key"></i> {{ guardando ? 'Guardando…' : 'Guardar contraseña' }}
  </button>
</div>
